# WSLN: Well-Scoped Locally Nameless, ported from Andrew Pitts' Agda library
# (see agda-code/agda) to Lean 4.
#
# Toolchain: Lean 4.33.1 (see lean-toolchain).  No external dependencies: the port
# uses Lean core only.
name = "wsln"
defaultTargets = ["WSLN", "Adequacy", "MLTT", "GST", "Examples"]

[[lean_lib]]
name = "WSLN"

[[lean_lib]]
name = "Adequacy"

[[lean_lib]]
name = "MLTT"

[[lean_lib]]
name = "GST"

[[lean_lib]]
name = "Examples"
